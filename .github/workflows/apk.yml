name: Fabricar APK MaVeBa

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml', 'icon-512.png']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Icono de la app
        run: |
          mkdir -p android/src/main/res/drawable-nodpi
          cp icon-512.png android/src/main/res/drawable-nodpi/ic_launcher.png

      - name: Llave de firma
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KS" | base64 -d > android/maveba.jks

      - name: Construir APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle assembleRelease --no-daemon -PvCode=${{ github.run_number }}

      - name: Preparar archivo
        run: cp android/build/outputs/apk/release/*.apk MaVeBa.apk

      - name: Publicar para descargar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: App MaVeBa
          body: "Toca **MaVeBa.apk** para descargar e instalar la app. Versión 1.${{ github.run_number }}"
          files: MaVeBa.apk
          make_latest: true
